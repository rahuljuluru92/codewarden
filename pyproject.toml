[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codewarden"
version = "0.0.1"
description = "Multi-agent architectural compliance checker over Tree-sitter ASTs."
requires-python = ">=3.11"
dependencies = [
    "langgraph==0.2.60",
    "langchain-core==0.3.28",
    "tree-sitter==0.23.2",
    "tree-sitter-python==0.23.6",
    "tree-sitter-typescript==0.23.2",
    "chromadb==0.5.23",
    "openai==1.59.6",
    "pydantic==2.10.4",
    "pyyaml==6.0.2",
]

[project.scripts]
codewarden = "codewarden.cli.main:main"

[tool.setuptools.packages.find]
include = ["codewarden*"]

[tool.pytest.ini_options]
markers = [
    "live: hits the real Groq API (costs tokens, non-deterministic) — excluded from the default fast suite",
]
addopts = "-m 'not live'"
