[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codewarden"
version = "0.0.1"
description = "Multi-agent architectural compliance checker over Tree-sitter ASTs."
requires-python = ">=3.11"

[project.scripts]
codewarden = "codewarden.cli.main:main"

[tool.setuptools.packages.find]
include = ["codewarden*"]

[tool.pytest.ini_options]
markers = [
    "live: hits the real Groq API (costs tokens, non-deterministic) — excluded from the default fast suite",
]
addopts = "-m 'not live'"
